<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій профіль</title>
</head>
<body>
    <main>
        <h1>Мій профіль</h1>
        <dl>
            <dt>Ім'я користувача</dt>
            <dd>{{ user.username }}</dd>
            <dt>Email</dt>
            <dd>{{ user.email|default:"Не вказано" }}</dd>
            <dt>Ім'я</dt>
            <dd>{{ user.first_name|default:"Не вказано" }}</dd>
            <dt>Прізвище</dt>
            <dd>{{ user.last_name|default:"Не вказано" }}</dd>
        </dl>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Вийти</button>
        </form>
    </main>
</body>
</html>
